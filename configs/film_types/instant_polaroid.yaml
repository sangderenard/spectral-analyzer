# Film type: Polaroid Instant (Type 600 / Spectra)
# Low-contrast, pastel colour instant emulsion.  Slightly warm-shifted,
# soft rendering, relatively coarse dye-dot structure.

name: instant_polaroid
description: "Polaroid Type 600 / Spectra instant emulsion — soft, pastel, warm"

active: warm_layer

layers:
  - name: warm_layer
    domain: acoustic
    iso: 0.8
    gamma: 1.85
    negative: false
    rotate180: true
    opacity: 1.0
    blend_mode: add
    hue: 38.0      # warm ivory
    saturation: 0.7
    spectral_bands:
      - center_hz: 110.0
        q: 1.3
        gain: 1.1
        label: "B0"
      - center_hz: 330.0
        q: 1.5
        gain: 1.0
        label: "B1"
      - center_hz: 660.0
        q: 1.5
        gain: 0.90
        label: "B2"
      - center_hz: 1800.0
        q: 1.3
        gain: 0.70
        label: "B3"
    activation: linear
    activation_params: {}
    tone_shadows:    [0.06, 0.05, 0.04]
    tone_highlights: [0.94, 0.90, 0.82]   # slightly desaturated ivory
    grain_sigma: 0.055    # coarse dye-dot
    grain_size: 5.0
    grain_colorimetry: chromatic
