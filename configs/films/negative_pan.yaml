# Film layer: negative_pan
# Reversal (negative) panchromatic — high acoustic energy appears as dense dark
# areas, silence is white.  Models a contact-sheet reading of the acoustic field.

name: negative_pan
domain: acoustic
iso: 1.4
gamma: 2.2
negative: true
rotate180: true
opacity: 1.0
blend_mode: add
hue: null
saturation: 1.0
sensitivity: 1.0
is_acoustic: true
is_em: false

spectral_bands:
  - center_hz: 110.0
    q: 1.5
    gain: 1.0
    label: "B0 55-220 Hz"
  - center_hz: 330.0
    q: 1.8
    gain: 1.0
    label: "B1 220-440 Hz"
  - center_hz: 660.0
    q: 1.8
    gain: 1.0
    label: "B2 440-880 Hz"
  - center_hz: 1800.0
    q: 1.5
    gain: 1.0
    label: "B3 880+ Hz"

activation: linear
activation_params: {}

tone_shadows:    [0.95, 0.92, 0.88]
tone_highlights: [0.05, 0.05, 0.05]
shadow_point:    0.10   # negative reversal — symmetric to acoustic_pan
highlight_point: 0.90

grain_sigma: 0.010
grain_size: 1.3
grain_colorimetry: luminance
