# Light: sodium_vapor_hps
# High-pressure sodium (HPS) arc lamp — dominant yellow-orange doublet.
# Street-lamp classic; virtually no blue output.

name: sodium_vapor_hps
description: "High-pressure sodium vapor (HPS) — dominant orange-yellow emission"

spectrum:
  type: lines
  lines:
    - {nm: 498.3,  weight: 0.04}  # weak green satellite
    - {nm: 568.8,  weight: 0.08}  # yellow-green satellite
    - {nm: 589.0,  weight: 0.42}  # D2 sodium doublet (dominant)
    - {nm: 589.6,  weight: 0.38}  # D1 sodium doublet (dominant)
    - {nm: 615.4,  weight: 0.06}  # orange satellite
    - {nm: 616.1,  weight: 0.02}

color_temperature_k: 2200.0
beam_angle_deg: 60.0
n_emitters: 9
