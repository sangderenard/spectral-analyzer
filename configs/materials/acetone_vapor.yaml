name: acetone_vapor
domain: optical
description: Molecular acetone vapor. Optical spectrum is not parameterized; condensed droplets require a separate phase.
albedo: [1.0, 1.0, 1.0]
roughness: 0.0
metallic: 0.0
transmission: 1.0
ior: 1.0
opacity: 0.0
emission_rgb: [0.0, 0.0, 0.0]
medium:
  schema: participating-medium-v1
  phase: molecular_gas
  formula: C3H6O
  molar_mass_kg_mol: 0.0580791
  particle_material_density_kg_m3: null
  optics:
    model: unparameterized
    mass_extinction_m2_kg: null
    mass_absorption_m2_kg: null
    mass_scattering_m2_kg: null
    single_scattering_albedo: null
    asymmetry_g: null
    phase_function: null
    refractive_index: null
    required_inputs:
      - Wavelength-resolved acetone absorption data at the actual temperature and pressure.
      - Acetone species concentration, not carrier-gas density.
      - Molecular scattering data if scattering is to be modeled.
    notes: No visible fog, condensation rule or flame emission is implied by the species identity.
  provenance:
    - property: molar_mass_kg_mol
      url: https://webbook.nist.gov/cgi/cbook.cgi?ID=C67641&Type=ANTOINE
      note: NIST Chemistry WebBook SRD 69 molecular weight 58.0791, converted from g/mol to kg/mol. Vapor-pressure data are not used as optical coefficients.
    - property: optics.required_inputs
      url: https://hitran.org/docs/cross-sections-definitions/
      note: Spectral molecular cross-section requirements only; no acetone spectrum has been imported.
notes: Surface fields are neutral editor placeholders. Physical absorption, molecular diffusion and sprite transparency remain separate quantities.
