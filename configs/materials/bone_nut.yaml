# Material: bone_nut
# Guitar nut — bleached bone or synthetic bone (TUSQ).
# Small off-white component at the headstock end of the fretboard.

name: bone_nut
description: Guitar nut — bleached bone or synthetic TUSQ

albedo_rgb: [0.90, 0.87, 0.78]       # linear sRGB — warm off-white / ivory
reflectivity: 0.60
diffusion: 0.70
absorption: 0.04

smoothness: 0.45
ior: 1.55

notes: >
  Bone has a faintly warm ivory tint from the mineral matrix.  Synthetic TUSQ
  is brighter: [0.94, 0.93, 0.90].  The nut is not modelled as BVH geometry
  currently (very small); included here for future high-detail renders.
