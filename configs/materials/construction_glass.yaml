notes: >
  Thin float glass (soda-lime composition, IOR 1.52) used as the placeholder
  material for any room surface triangle that has not yet received its assigned
  finish material.  The slight blue-green albedo bias ([0.72, 0.82, 0.85])
  and low opacity (0.15) match the visual language already used for unfinished
  PlacedEnclosure console glass.  High transmittance means the geometry is
  visible but clearly incomplete.  This material should never appear in a
  fully delivered room.
