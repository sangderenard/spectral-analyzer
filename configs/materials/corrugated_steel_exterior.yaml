notes: >
  Zinc-coated hot-dip galvanised steel profiled sheet.  Metallic=1 with a
  moderate roughness captures the slightly diffuse specular of a weathered
  galvanised surface.  The imaginary IOR component (extinction coefficient)
  is consistent with published n,k values for zinc at visible wavelengths.
  Slight red-channel boost at high frequency (blue band) reflects the subtle
  warm shift of galvanised coatings versus bare steel.
