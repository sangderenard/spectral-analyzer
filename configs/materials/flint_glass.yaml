# Material: flint_glass
# Dense flint glass — high IOR, high dispersion.
# Classic material for prisms, chandeliers, and high-dispersion optical elements.
# Produces strongly chromatic caustics (rainbow splitting).

name: flint_glass
description: Dense flint glass — high IOR, high chromatic dispersion

albedo_rgb: [0.94, 0.94, 0.96]       # very faint cool tint
reflectivity: 0.062                    # higher Fresnel from higher IOR
diffusion: 0.02
absorption: 0.004

ior: 1.720                             # SF11 dense flint
opacity: 0.0

transmission_rgb: [0.97, 0.97, 0.98]
abbe_number: 29.5                      # high dispersion (low V-number)
cauchy_b: 0.01380                      # strong dn/dλ — pronounced spectral splitting

smoothness: 0.99
notes: >
  High IOR (1.72) means total internal reflection kicks in early (~35° critical angle),
  producing strong retroreflective effects in curved geometries.
  The high Cauchy B produces visible spectral dispersion — red and blue focal points
  separate measurably, making this the ideal material for caustic rainbow tests.
  Use for chandelier-type objects or prisms placed near acoustic sources.
