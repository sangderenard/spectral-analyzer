name: halite_dust_coarse
domain: optical
description: Dry sodium-chloride coarse-dust reference with an explicitly approximate 25 micrometre sphere radius; not a humid sea-salt aerosol model.
albedo: [1.0, 1.0, 1.0]
roughness: 0.0
metallic: 0.0
transmission: 1.0
ior: 1.0
opacity: 0.0
emission_rgb: [0.0, 0.0, 0.0]
medium:
  schema: participating-medium-v1
  phase: solid_aerosol
  formula: NaCl
  molar_mass_kg_mol: null
  particle_material_density_kg_m3: 2168.0
  optics:
    model: geometric_optics_spheres
    particle_radius_m: 0.000025
    size_distribution: monodisperse_reference
    extinction_efficiency: 2.0
    wavelength_interval_m: [0.0000004, 0.0000007]
    mass_extinction_m2_kg: null
    mass_absorption_m2_kg: null
    mass_scattering_m2_kg: null
    single_scattering_albedo: null
    asymmetry_g: null
    phase_function: null
    refractive_index: null
    approximation: Idealized dry equal-volume spheres with Q_ext=2 in the large-particle limit. This visible scope has no supplied error bound. Cubic grain shape, mixed sea-salt composition, deliquescence and humidity-driven size changes are not modeled.
    required_inputs:
      - Suspended dry NaCl mass per carrier volume in kg/m3.
      - Explicit acceptance of this coarse-particle geometric-optics approximation.
  provenance:
    - property: particle_material_density_kg_m3
      url: https://www.handbookofmineralogy.org/pdfs/halite.pdf
      note: Handbook of Mineralogy gives measured density 2.168 g/cm3, converted to 2168 kg/m3. No packing fraction or aerosol concentration is implied.
    - property: optics.model
      url: https://journals.ametsoc.org/view/journals/atsc/79/11/JAS-D-22-0047.1.xml
      note: Geometric scattering limit Q_ext=2 and particle extinction cross section; this is an idealized sphere approximation, not measured salt aerosol data.
    - property: optics.particle_radius_m
      url: https://www.hec.usace.army.mil/confluence/rasdocs/d2sd/ras2dsedtr/6.6/model-description/water-and-sediment-properties/sediment-properties
      note: Radius 25 micrometres is an authored coarse reference assumption using equivalent-volume diameter, not a reported ambient sea-salt distribution.
notes: Neutral surface fields are editor placeholders. Solid salt and aqueous droplets are separate phases; relative humidity does not silently activate growth or fog here.
