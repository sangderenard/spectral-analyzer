notes: >
  Standard interior room wall finish — gypsum plaster base coat with two
  coats of flat latex paint.  The warm bias (red reflectance > blue) gives
  the characteristic slightly cream tone of interior paint without appearing
  overtly yellow.  High diffuse fraction keeps specular highlights negligible
  at normal room lighting angles.
