# ─────────────────────────────────────────────────────────────────────────────
# Central spectral profile library
# ─────────────────────────────────────────────────────────────────────────────
# Every named ColorProfile / EmissionProfile / RemissionProfile referenced by
# a material YAML is defined here.  Loaded once at engine startup by
# `spectral_library.load_default_library()`, which registers each entry into
# the global EmissionProfileDatabase and bakes the spectral→sRGB tensor before
# any material is registered.  The hot loop never reads this file.
#
# Authoring conventions
# ─────────────────────
# • Each spread is a list of additive parametric terms whose centres are
#   wavelengths in nanometres (380–780 nm, the visible band).  `q` is a
#   width-shape parameter; larger q ⇒ narrower lobe.
# • EmissionProfile entries carry an absolute `total_power_W` that scales the
#   output sRGB at bake time.  ColorProfile / RemissionProfile entries carry
#   no explicit power — they encode reflectance and rely on per-frame stimulus
#   for amplitude.
# • RemissionProfile entries optionally carry `response_envelope` which makes
#   the material a frame-delayed re-emitter.  If `curve` is omitted, a default
#   exponential decay over `decay_frames` frames is used.
# ─────────────────────────────────────────────────────────────────────────────

# ── Reflective body colors (ColorProfile) ────────────────────────────────────
