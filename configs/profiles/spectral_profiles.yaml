# ── Emissive light sources (EmissionProfile) ────────────────────────────────
emission:
  basic_led_display:
    spd:
      - {amp: 1.00, center: 450.0, q: 18.0}   # narrow blue pump
      - {amp: 0.30, center: 510.0, q: 5.0}    # cyan phosphor shoulder
    peak_wavelength_nm: 450.0
    fwhm_nm:           25.0
    total_power_W:     0.35

  missing_material_hazard:
    spd:
      - {amp: 1.00, center: 590.0, q: 12.0}
      - {amp: 0.25, center: 620.0, q: 10.0}
    peak_wavelength_nm: 590.0
    fwhm_nm:           49.0
    total_power_W:     2.6

  material_database_failure:
    spd:
      - {amp: 1.00, center: 532.0, q: 18.0}
      - {amp: 0.30, center: 505.0, q: 10.0}
    peak_wavelength_nm: 532.0
    fwhm_nm:           22.0
    total_power_W:     3.2

  emerald_internal:
    spd:
      - {amp: 1.00, center: 525.0, q: 14.0}   # narrow green pump
      - {amp: 0.45, center: 560.0, q: 8.0}    # warm shoulder
    peak_wavelength_nm: 525.0
    fwhm_nm:           30.0
    total_power_W:     1.4

  sapphire_internal:
    spd:
      - {amp: 1.00, center: 465.0, q: 16.0}
      - {amp: 0.30, center: 495.0, q: 8.0}
    peak_wavelength_nm: 465.0
    fwhm_nm:           28.0
    total_power_W:     1.6

  ruby_internal:
    spd:
      - {amp: 1.00, center: 695.0, q: 18.0}
    peak_wavelength_nm: 695.0
    fwhm_nm:           20.0
    total_power_W:     0.05


# ── Frame-delayed re-emitters (RemissionProfile + response envelope) ────────
# Each entry's `frequency` defines the spectral shape of the re-emitted light;
# `response_envelope` defines how that light builds up and decays over the
# frames following an absorbed-stimulus event.
remission:
  # Ruby fluorescence-style afterglow: the body itself doesn't emit, but
  # under stimulus it re-emits a deep red along the same band as the body
  # color, with a thermal-style 12-frame exponential tail.
  ruby_afterglow:
    frequency:
      - {amp: 1.0, center: 690.0, q: 6.0}
    response_envelope:
      decay_frames: 12
      gain:         0.85
      # Default exponential decay (curve omitted)

  # Slate (saddle backdrop): cool, slow re-emission — picks up scene light
  # and quietly glows back over a long tail.  Useful as a "the room
  # remembered the gem" effect.
  slate_afterglow:
    frequency:
      - {amp: 0.6, center: 480.0, q: 3.0}
    response_envelope:
      decay_frames: 24
      gain:         0.30
