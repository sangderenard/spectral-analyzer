# configs/room_station/physics.yaml
# Player physics parameters.  Consumed by RoomWorkspace.physics_config()
# and passed to PlayerController.

walk:
  start_pos:         [0.0, 0.0, 0.8]   # world-space starting position
  start_yaw:         0.0               # degrees, 0 = looking toward +z
  eye_height:        1.65              # metres above ground
  move_speed:        3.0               # m/s walking
  run_multiplier:    2.2               # applied when Shift held
  mouse_sensitivity: 0.15
  pitch_limit_deg:   75.0
  transition_to_orbit_key: tab

orbit:
  mouse_sensitivity: 0.35
  zoom_rate:         0.06
  transition_to_walk_key: tab

interact:
  lerp_speed:  6.0
  trigger_key: e
  exit_key:    escape
  hud_hint:    "[ E ]  Interact"

initial_state: walk

# Collision / floor
collision:
  floor_y:          0.0       # world-space floor elevation
  ceiling_y:        4.0
  gravity_mps2:     9.8       # not yet used by PlayerController (placeholder)
  step_height_m:    0.20      # stair-step allowance
  collision_margin: 0.30      # cylinder radius around player centre
